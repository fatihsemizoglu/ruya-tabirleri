<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
    <!-- Warm up the social share image without competing with critical page assets -->
    <link rel="prefetch" as="image" href="/og-image.png" />
    <link rel="prefetch" href="/populer" as="document" />
    <link rel="prefetch" href="/ara" as="document" />

    <!-- Primary Meta Tags -->
    <title>Rüya Tabirleri - En Kapsamlı Rüya Yorumları Sitesi</title>
    <meta name="title" content="Rüya Tabirleri - En Kapsamlı Rüya Yorumları Sitesi" />
    <meta name="description" content="Binlerce rüya tabiri arasında arama yapın. İslami ve psikolojik yorumlarla rüyalarınızın anlamını keşfedin. Ücretsiz rüya günlüğü tutun." />
    <meta name="author" content="Mistik Günlük" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="language" content="Turkish" />

    <!-- Geo targeting (Türkiye odaklı Türkçe içerik) -->
    <meta name="geo.region" content="TR" />
    <meta name="geo.placename" content="Türkiye" />
    <meta name="geo.position" content="39.0;35.0" />
    <meta name="ICBM" content="39.0, 35.0" />

    <!-- Canonical URL -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Rüya Tabirleri - En Kapsamlı Rüya Yorumları Sitesi" />
    <meta property="og:description" content="Binlerce rüya tabiri arasında arama yapın. İslami ve psikolojik yorumlarla rüyalarınızın anlamını keşfedin." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rüya Tabirleri — Türkçe rüya yorumları ve sembol sözlüğü" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:site_name" content="Rüya Tabirleri" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%VITE_SITE_URL%/" />
    <meta name="twitter:title" content="Rüya Tabirleri - En Kapsamlı Rüya Yorumları Sitesi" />
    <meta name="twitter:description" content="Binlerce rüya tabiri arasında arama yapın. İslami ve psikolojik yorumlarla rüyalarınızın anlamını keşfedin." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="Rüya Tabirleri — Türkçe rüya yorumları ve sembol sözlüğü" />

    <!-- Structured Data: WebSite + SearchAction (rich result for sitelinks search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Rüya Tabirleri",
      "url": "%VITE_SITE_URL%/",
      "inLanguage": "tr-TR",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "%VITE_SITE_URL%/ara?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rüya Tabirleri" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Rüya Tabirleri" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#6366f1" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- iOS uses apple-touch-icon as splash when no startup-image links are present -->

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
